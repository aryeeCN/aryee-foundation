server:
  port: 8081

spring:
  application:
    name: security-blocking-example
  datasource:
    url: jdbc:h2:mem:security_example;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

# Aryee Security 配置
aryee:
  security:
    enabled: true
    jwt:
      secret: aryee-security-example-jwt-secret-key-please-change-in-production
      access-token-expiration: 3600
      refresh-token-expiration: 86400
      blacklist-enabled: true
    password-policy:
      min-length: 8
      max-length: 32
      require-lowercase: true
      require-uppercase: true
      require-digit: true
      require-special-char: false
      validity-days: 90
      max-attempts: 5
      history-check-count: 5
    session-policy:
      user-max-sessions: 3
      idle-timeout-minutes: 30
      absolute-timeout-hours: 12
    auth:
      mfa-enabled: false
      account-lock-enabled: true
      max-login-attempts: 5
      lock-duration-minutes: 30
      login-log-enabled: true
