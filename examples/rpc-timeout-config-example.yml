## 最佳实践建议

### 1. 超时设置原则

**3-6-9 法则:**
- **读操作**: 3 秒 (查询、获取信息)
- **写操作**: 6 秒 (创建、更新、删除)
- **批处理**: 9 秒 (报表、导入导出)

### 2. 不同服务的超时建议

| 服务类型 | 推荐超时 | 说明 |
|---------|---------|------|
| **用户服务** | 6-8 秒 | 核心业务，需要快速响应 |
| **订单服务** | 8-12 秒 | 涉及多个系统调用 |
| **支付服务** | 10-15 秒 | 依赖第三方，耗时较长 |
| **通知服务** | 3-5 秒 | 简单操作，快速失败 |
| **报表服务** | 20-30 秒 | 批处理，允许较长时间 |
| **文件服务** | 15-20 秒 | 文件上传下载 |

### 3. 超时与重试配合

```yaml
aryee:
  rpc:
   timeout:
     default-timeout: 5000
    retry:
      max-attempts: 3
      initial-interval: 1000
```

**总耗时计算:**
```
第一次：5s (超时)
等待：1s
第二次：5s (超时)
等待：2s
第三次：5s (成功或失败)

最坏情况：5 +1 +5 +2 + 5 = 18 秒
```

### 4. 监控告警配置

