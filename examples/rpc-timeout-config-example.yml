## 监控指标

### Micrometer 指标

```java
// 自动注册的指标
rpc.requests.total          // RPC 请求总数
rpc.requests.success        // 成功次数
rpc.requests.failed         // 失败次数
rpc.requests.timeout        // 超时次数

rpc.duration.seconds        // 调用延迟分布
rpc.duration.seconds.max    // 最大延迟
rpc.duration.seconds.p95    // P95 延迟
rpc.duration.seconds.p99    // P99 延迟
```

