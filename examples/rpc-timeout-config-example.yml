## 常见问题 FAQ

### Q1: 为什么设置了超时不生效？

**A:**检查以下几点:
1. 确认 `dynamic-enabled` 是否为 `true`
2. 确认请求中的 `serviceName` 是否与配置一致
3. 查看日志是否有 `RpcTimeoutManager` 的 debug 输出

### Q2: 如何为不同的方法设置不同的超时？

**A:** 有两种方式:
```java
// 方式 1: 在请求中直接指定
RpcRequest request = new RpcRequest();
request.setTimeout(10000L); // 10 秒

// 方式 2: 使用不同的服务名称区分
request.setServiceName("user-service-read");   // 读操作 3 秒
request.setServiceName("user-service-write");  // 写操作 6 秒
```

### Q3: 超时时间设置多少合适？

**A:** 参考以下步骤:
1. 统计历史调用的 P95、P99 延迟
2. 设置为 P99 延迟的 1.5-2 倍
3. 考虑业务可接受的最大等待时间
4. 预留 20-30% 的余量

**示例:**
```
P95 延迟：2 秒
P99 延迟：3 秒
建议超时：3 * 1.5 = 4.5 秒 → 取整 5 秒
```

### Q4: 如何在运行时动态调整超时？

**A:** 结合配置中心 (如 Nacos、Apollo):
```java
@Component
public class DynamicTimeoutConfig {
    
    @Value("${aryee.rpc.timeout.default-timeout:5000}")
    private long defaultTimeout;
    
    @PostConstruct
   public void init() {
        // 监听配置变化
        configChangeListener.registerListener(event -> {
            String newValue = event.getPropertyValue();
           timeoutProperties.setDefaultTimeout(Duration.ofMillis(Long.parseLong(newValue)));
        });
    }
}
```

