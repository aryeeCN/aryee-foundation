# Aryee RPC 超时配置示例

## 📋 配置文件说明

本文档提供了 Aryee RPC 模块的完整配置示例，帮助开发者快速上手。

---

## application.yml 完整配置

```yaml
aryee:
  rpc:
    # 超时配置
   timeout:
      # 默认超时时间 (毫秒)
     default-timeout: 5000
      
      # 连接超时时间 (毫秒)
      connection-timeout: 3000
      
      # 读取超时时间 (毫秒)
      read-timeout: 10000
      
      # 是否启用动态超时
      dynamic-enabled: true
      
      # 最大超时时间 (毫秒)
      max-timeout: 60000
      
      # 最小超时时间 (毫秒)
      min-timeout: 100
      
      # 按服务配置的超时时间
      per-service-timeouts:
        # 用户服务 - 8 秒
        user-service: 8000
        
        # 订单服务 - 12 秒
        order-service: 12000
        
        # 支付服务 - 15 秒
        payment-service: 15000
        
        # 通知服务 - 5 秒
        notification-service: 5000
        
        # 报表服务 - 30 秒 (批处理)
        report-service: 30000
    
    # 重试配置
    retry:
      # 是否启用重试
      enabled: true
      
      # 最大重试次数
      max-attempts: 3
      
      # 初始退避时间 (毫秒)
      initial-interval: 1000
      
      # 最大退避时间 (毫秒)
      max-interval: 10000
      
      # 退避乘数 (指数增长系数)
      multiplier: 2.0
      
      # 随机抖动系数 (0-1)
      jitter: 0.5
    
    # 熔断配置 (如果使用 Resilience4j)
    circuit-breaker:
      # 是否启用熔断器
      enabled: false
      
      # 滑动窗口大小
      sliding-window-size: 10
      
      # 失败率阈值 (%)
      failure-rate-threshold: 50
      
      # 慢调用阈值 (毫秒)
      slow-call-duration-threshold: 3000
      
      # 半开状态等待时间 (秒)
      wait-duration-in-open-state: 30
      
      # 半开状态测试调用次数
      permitted-number-of-calls-in-half-open-state: 5
```

