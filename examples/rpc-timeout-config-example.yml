### 生产环境 (application-prod.yml)

```yaml
aryee:
  rpc:
   timeout:
     default-timeout: 5000   # 生产环境严格控制在 5 秒
      connection-timeout: 2000
      read-timeout: 10000
      dynamic-enabled: true
      max-timeout: 30000      # 最大 30 秒
      min-timeout: 500        # 最小 500 毫秒
      per-service-timeouts:
        # 核心服务优先保证响应速度
        user-service: 6000
        order-service: 8000
        payment-service: 10000
        
        # 非核心服务可以适当放宽
        notification-service: 5000
        report-service: 20000
```

