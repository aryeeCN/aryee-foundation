## 代码中使用

### 方式一：注入 RpcTimeoutManager

```java
@Service
public class MyRpcService {
    
    @Autowired
    private RpcTimeoutManager timeoutManager;
    
    @Autowired
    private ReactiveRpcClient rpcClient;
    
   public Mono<RpcResponse> callService(String serviceName, Object data) {
        RpcRequest request = new RpcRequest();
        request.setServiceName(serviceName);
        request.setData(data);
        
        // 应用配置的超时
       timeoutManager.applyTimeout(request);
        
        return rpcClient.execute(request)
            .timeout(timeoutManager.getTimeout(request))
            .onErrorResume(RpcExceptionHandler.errorHandler(request));
    }
}
```

### 方式二：直接使用 RpcTimeoutProperties

```java
@Service
public class MyService {
    
    @Autowired
    private RpcTimeoutProperties timeoutProperties;
    
   public void doSomething() {
        // 获取默认超时
        Duration defaultTimeout = timeoutProperties.getDefaultTimeout();
        
        // 获取特定服务的超时
        Duration userSvcTimeout = timeoutProperties.getTimeoutForService("user-service");
        
        // 验证超时时间是否有效
        boolean isValid = timeoutProperties.isValidTimeout(Duration.ofSeconds(10));
    }
}
```

