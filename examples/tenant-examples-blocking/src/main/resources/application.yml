server:
  port: 8083

spring:
  application:
    name: tenant-blocking-examples

aryee:
  tenant:
    enabled: true
    mode: ROW
    tenant-id-column: tenant_id
    tenant-id-header: X-Tenant-Id
    default-tenant-id: system
    allow-empty-tenant-id: true
    validation-enabled: true
    validation-cache-ttl: 300000
    switch-aspect-enabled: true
    nested-switch-enabled: true

logging:
  level:
    cn.aryee.tenant: DEBUG
