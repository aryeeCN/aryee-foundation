server:
  port: 8082

spring:
  application:
    name: ai-examples-reactive
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-demo}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7

# Aryee AI 配置
aryee:
  ai:
    enabled: true
    llm:
      provider: openai
      model: gpt-4o
      temperature: 0.7
      max-tokens: 4096
      system-prompt: "You are a helpful assistant."
    session:
      enabled: true
      timeout: 1h
      max-messages: 50

logging:
  level:
    cn.aryee.ai: DEBUG
    cn.aryee.examples.ai: INFO
    org.springframework.ai: INFO
